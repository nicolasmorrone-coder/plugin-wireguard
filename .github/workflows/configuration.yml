name: Configuration regression
on:
  push:
    branches: [first-config-write]
  pull_request:
    branches: [beta]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: php -d error_reporting=-1 tests/configurationWriteTest.php
